<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elder Care</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--hub-bg, #f9fafb);
      --surface: var(--hub-surface, #ffffff);
      --border: var(--hub-border, #e5e7eb);
      --border-mid: var(--hub-border, #d1d5db);
      --text: var(--hub-text, #000000);
      --muted: var(--hub-text-muted, #6b7280);
      --accent: var(--hub-primary, #7c3aed);
      --accent-hover: var(--hub-primary-hover, #6d28d9);
      --accent-fg: var(--hub-primary-fg, #ffffff);
      --radius: var(--hub-radius, 8px);
      --green: var(--hub-tint-success-fg, #047857); --green-soft: var(--hub-tint-success, #d1fae5);
      --amber: var(--hub-tint-warning-fg, #b45309); --amber-soft: var(--hub-tint-warning, #fef3c7);
      --red: var(--hub-tint-danger-fg, #b91c1c); --red-soft: var(--hub-tint-danger, #fee2e2);
      --blue: var(--hub-tint-info-fg, #1d4ed8); --blue-soft: var(--hub-tint-info, #dbeafe);
      --shadow: 0 1px 3px rgba(15, 23, 42, .07);
    }
    body { min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: var(--hub-font-size, 15px); line-height: 1.5; }
    .app { max-width: 780px; margin: 0 auto; padding: 16px; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    h1 { font-size: 1.35rem; line-height: 1.2; }
    h2 { font-size: 1rem; margin-bottom: 10px; }
    h3 { font-size: .95rem; }
    .muted { color: var(--muted); }
    .tiny { font-size: .78rem; }
    .stack { display: grid; gap: 12px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; }
    .row-card { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .pill { display: inline-flex; align-items: center; justify-content: center; min-height: 22px; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); font-size: .72rem; font-weight: 700; white-space: nowrap; }
    .pill.good { background: var(--green-soft); color: var(--green); }
    .pill.warn { background: var(--amber-soft); color: var(--amber); }
    .pill.info { background: var(--blue-soft); color: var(--blue); }
    .pill.mood { background: var(--hub-tint-accent, #ede9fe); color: var(--hub-tint-accent-fg, #6d28d9); }
    .tabs { display: flex; gap: 4px; background: var(--border); padding: 3px; border-radius: 10px; margin-bottom: 14px; overflow-x: auto; }
    .tab { flex: 1; border: 0; border-radius: 8px; background: transparent; color: var(--muted); padding: 8px 7px; font: inherit; font-weight: 700; font-size: .85rem; cursor: pointer; white-space: nowrap; }
    .tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 2px 10px; }
    .section-head h2 { margin-bottom: 0; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: 8px; padding: 8px 12px; font: inherit; font-size: .86rem; font-weight: 700; cursor: pointer; min-height: 38px; background: var(--accent); color: var(--accent-fg); }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: .48; cursor: default; }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--border-mid); }
    .btn-ghost:hover { background: var(--bg); }
    .btn-danger { background: var(--red-soft); color: var(--red); border-color: transparent; }
    .btn-sm { min-height: 31px; padding: 5px 9px; font-size: .78rem; }
    .avatar { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: white; font-size: .74rem; font-weight: 800; flex-shrink: 0; }
    .who { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .meta { color: var(--muted); font-size: .8rem; margin-top: 3px; }
    .form { display: grid; gap: 10px; }
    .field { display: grid; gap: 4px; }
    .two { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
    label { font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 800; }
    input, textarea, select { width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px; padding: 9px 11px; font: inherit; background: var(--surface); color: var(--text); }
    textarea { min-height: 68px; resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    .empty, .loading { color: var(--muted); text-align: center; padding: 30px 16px; }
    .load-error { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .load-error-retry { background: none; border: 1px solid currentColor; border-radius: 8px; padding: 5px 10px; font: inherit; font-weight: 600; color: inherit; cursor: pointer; flex-shrink: 0; }
    .error { background: var(--red-soft); color: var(--red); padding: 9px 12px; border-radius: 8px; margin-bottom: 10px; font-size: .86rem; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
    .modal { background: var(--surface); border-radius: 12px; padding: 18px; width: 100%; max-width: 460px; max-height: 90vh; overflow: auto; box-shadow: 0 20px 50px rgba(15,23,42,.25); }
    .modal h2 { margin-bottom: 14px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
    .done { opacity: .6; }
    .done .task-title { text-decoration: line-through; }
    @media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip { border: 1.5px solid var(--border-mid); border-radius: 999px; background: var(--surface); color: var(--text); padding: 6px 13px; font: inherit; font-size: .84rem; font-weight: 700; cursor: pointer; min-height: 34px; }
    .chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
    .profile { display: grid; gap: 12px; }
    .profile dt { font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 800; }
    .profile dd { overflow-wrap: anywhere; }
    .profile dd.long { white-space: pre-wrap; }
    .hint { color: var(--muted); font-size: .78rem; }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }
  </style>
  <base href="/run/elder-care/">
</head>
<body>
<div class="app"><div id="root" class="loading">Loading…</div></div>

<script type="module">
import { esc, isAdult, memberColor, initial, hubConfirm, searchMatch, hubToday as today, glyph, chickadee } from "/hub-sdk.js";
import {
  CATEGORIES, fmtDate, fmtWhen, memberName as memberNameOf, catOf,
  scheduleList, appointmentList, openTasks, doneTasks, searchableFields, calendarRef,
  PROFILE_FIELDS, activeProfiles, archivedProfiles, viewProfileId, profileInView,
  forProfile, showsProfileTag, profileName, linkableMembers, untaggedCount,
  profileEntries, profileChanges,
} from "./logic.js";

const CONTEXT = window.__CONTEXT_URL ?? "";
const DB = window.__DB_URL ?? "";
const EVENTS_URL = window.__EVENTS_URL ?? "/api/events";
const APP_ID = window.__APP_ID ?? "elder-care";
const HUB_MEMBER = window.__CURRENT_MEMBER ?? null;

let members = [], memberMap = new Map(), me = null;
let visits = [], tasks = [], appointments = [], observations = [];
// The people being cared for, and which one the lists are narrowed to ("" for
// everyone). See logic.js for what the selection means with one profile, or none.
let profiles = [];
let selectedProfileId = "";
let tab = "schedule";
let searchQ = "";       // in-app search (see logic.js searchableFields)
let error = "";
let loadFailed = false; // the first load failed: nothing is known, so nothing is shown as empty
let modalEl = null;

function nowIso() { return new Date().toISOString(); }
function uid(p) { return `${p}-${crypto.randomUUID()}`; }
function memberName(id) { return memberNameOf(memberMap, id); }
function canEdit() { return isAdult(me); }
function viewId() { return viewProfileId(profiles, selectedProfileId); }
function inView() { return profileInView(profiles, selectedProfileId); }

async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sql, params }) });
  const json = await res.json().catch(() => null);
  if (!res.ok || !json || typeof json !== "object" || json.error) throw new Error(json?.error || "Couldn’t reach the hub. Try again.");
  return json;
}

async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "demo-1", name: "Dana", role: "adult" },
      { id: "demo-2", name: "Sam", role: "adult" },
      { id: "demo-3", name: "Pat", role: "adult" },
    ];
  } else {
    try { const res = await fetch(`${CONTEXT}?keys=family.members`); members = ((await res.json())["family.members"]) ?? []; }
    catch { members = []; }
  }
  memberMap = new Map(members.map(m => [m.id, m]));
  me = HUB_MEMBER ?? members[0] ?? { id: "guest", name: "Guest", role: "adult" };
}

function seedDemo() {
  const profile = (id, name, fields) => ({
    id, name, member_id: null, ...Object.fromEntries(PROFILE_FIELDS.map(f => [f.key, ""])), ...fields,
    archived_at: "", created_by: "demo-1", created_at: nowIso(), updated_at: nowIso(),
  });
  profiles = [
    profile("p1", "Mom", { born_on: "1944-03-09", residence: "At home on Alder Street", primary_doctor: "Dr. Reyes, 555-0142", diagnoses: "High blood pressure\nArthritis in both knees", mobility: "Uses a cane outdoors. Needs a hand on the stairs.", baseline: "Up by seven, reads the paper, walks to the corner after lunch." }),
    profile("p2", "Dad", { born_on: "1941-11-22", residence: "At home on Alder Street", cognition: "Forgets recent conversations. Knows everyone." }),
  ];
  visits = [
    { id: "v1", profile_id: "", date: today(), time: "10:00", member_id: "demo-1", member_name: "Dana", note: "Morning check-in, breakfast", created_by: "demo-1", created_at: nowIso() },
    { id: "v2", profile_id: "p1", date: today(), time: "18:00", member_id: "demo-2", member_name: "Sam", note: "Dinner and meds", created_by: "demo-2", created_at: nowIso() },
  ];
  tasks = [
    { id: "t1", profile_id: "p1", title: "Call Dr. Reyes about the new prescription", detail: "Ask if it can be taken with breakfast.", assignee_id: "demo-3", assignee_name: "Pat", due_date: today(), status: "open", created_by: "demo-1", created_by_name: "Dana", created_at: nowIso(), completed_at: "" },
    { id: "t2", profile_id: "", title: "Refill blood pressure meds", detail: "", assignee_id: "demo-2", assignee_name: "Sam", due_date: "", status: "done", created_by: "demo-2", created_by_name: "Sam", created_at: nowIso(), completed_at: nowIso() },
  ];
  appointments = [
    { id: "a1", profile_id: "p1", title: "Cardiology follow-up", provider: "Dr. Reyes", date: today(), time: "14:30", location: "Mercy Clinic, Suite 210", accompanied_by_id: "demo-1", accompanied_by_name: "Dana", notes: "Bring the medication list.", created_by: "demo-1", created_at: nowIso() },
  ];
  observations = [
    { id: "o1", profile_id: "p2", member_id: "demo-2", member_name: "Sam", category: "mood", note: "In good spirits today, enjoyed the walk.", observed_at: nowIso(), created_at: nowIso() },
    { id: "o2", profile_id: "p1", member_id: "demo-1", member_name: "Dana", category: "health", note: "Slight swelling in ankles, keeping an eye on it.", observed_at: nowIso(), created_at: nowIso() },
  ];
}

async function loadData() {
  if (!DB) { seedDemo(); return; }
  // Each read is windowed so the per-launch scan stays bounded as years of
  // care history accrue. Visits/appointments keep 30 days of past rows so the
  // no-upcoming fallback still shows something recent; tasks keep every open
  // row (completed_at = '') plus 120 days of completed ones; observations keep
  // a 120-day feed. The date param is the household-local day so the hub's
  // `:today` preload binding matches this text. Profiles are read whole: the
  // table grows with the people being cared for, not with time.
  const [v, t, a, o, r] = await Promise.all([
    db("SELECT * FROM app_elder_care__visits WHERE date >= date(?, '-30 days') ORDER BY date ASC, time ASC", [today()]),
    db("SELECT * FROM app_elder_care__tasks WHERE completed_at = '' OR completed_at >= date(?, '-120 days') ORDER BY (status = 'done'), (due_date = ''), due_date ASC, created_at DESC", [today()]),
    db("SELECT * FROM app_elder_care__appointments WHERE date >= date(?, '-30 days') ORDER BY date ASC, time ASC", [today()]),
    db("SELECT * FROM app_elder_care__observations WHERE observed_at >= date(?, '-120 days') ORDER BY observed_at DESC", [today()]),
    db("SELECT * FROM app_elder_care__profiles ORDER BY created_at ASC"),
  ]);
  visits = v.rows; tasks = t.rows; appointments = a.rows; observations = o.rows; profiles = r.rows;
}

// ── Earlier history ────────────────────────────────────────────────────────
//
// The windows above bound the LAUNCH read; they must not bound what the family
// can see. None of these tables declares retain_days, so every row older than
// its window is still stored — it was simply unreachable, with nothing on
// screen saying so. In a care app that is the wrong trade to make silently: the
// observation log and the visit history are exactly the record someone goes
// back through to answer "when did this start?" or "how often did we come?".
//
// So the older rows load on demand: when a person asks for them, and whenever
// the observation search runs — search matches note text, which is encrypted at
// rest and can only be compared client-side, so a windowed search would quietly
// answer "no results" about records that exist. The promise is the guard, so
// repeated keystrokes cannot start a second read.
let historyLoaded = false;
let historyError = false;
let historyPromise = null;
function loadFullHistory() {
  if (!DB || historyLoaded) return Promise.resolve();
  historyPromise ??= Promise.all([
    db("SELECT * FROM app_elder_care__visits ORDER BY date ASC, time ASC"),
    db("SELECT * FROM app_elder_care__tasks ORDER BY (status = 'done'), (due_date = ''), due_date ASC, created_at DESC"),
    db("SELECT * FROM app_elder_care__appointments ORDER BY date ASC, time ASC"),
    db("SELECT * FROM app_elder_care__observations ORDER BY observed_at DESC"),
  ])
    .then(([v, t, a, o]) => {
      // Replace rather than append: these statements are supersets of the
      // windowed ones and arrive in the same order, so there is no merge to get
      // wrong and no chance of a duplicate.
      visits = v.rows; tasks = t.rows; appointments = a.rows; observations = o.rows;
      historyLoaded = true;
      historyError = false;
    })
    .catch((e) => { historyPromise = null; historyError = true; throw e; });
  return historyPromise;
}

function earlierHistoryHtml() {
  if (historyLoaded) return "";
  if (historyError) return `<div class="card empty">Earlier history could not be loaded. <button class="btn btn-ghost btn-sm" data-load-history>Try again</button></div>`;
  return `<button class="btn btn-ghost btn-sm" data-load-history style="width:100%;margin-top:12px">Show earlier history</button>`;
}

async function init() {
  try { await Promise.all([loadMembers(), loadData()]); loadFailed = false; render(); }
  catch { loadFailed = true; render(); }
}

function postEvent(type, payload) {
  return fetch(EVENTS_URL, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ source_app_id: APP_ID, type, payload }) });
}

/**
 * Announcements. Fire-and-forget on purpose: a dropped `..._added` costs a
 * calendar entry that was never made, and the row is here to be seen either
 * way. Nothing downstream is left saying something untrue.
 */
function publish(type, payload) {
  postEvent(type, payload).catch(() => {});
}

/**
 * Retractions, which are NOT interchangeable with the above. A dropped
 * retraction leaves a calendar entry telling whoever is driving to be
 * somewhere for an appointment that no longer exists — the exact failure the
 * retraction exists to prevent, and one nothing else will ever notice, because
 * the row it disagreed with is gone. So: awaited, retried once (the usual
 * cause is a transient network blip on a page that is about to be closed), and
 * on final failure said out loud, since a person who knows the calendar is
 * stale can go clear it and a person who doesn't cannot.
 */
async function publishRetraction(type, payload) {
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const res = await postEvent(type, payload);
      if (res.ok) return true;
      // 4xx is a verdict, not a blip — the ACL rejected us, or the payload is
      // wrong. Retrying sends the identical request to the identical answer.
      if (res.status < 500) break;
    } catch { /* network failure — worth the one retry below */ }
  }
  showError("Removed here, but the calendar entry it created could not be taken down. Check the calendar.");
  return false;
}

/* ── modal ── */
function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  const first = modalEl.querySelector("[data-autofocus]");
  if (first) first.focus();
}
function closeModal() { modalEl?.remove(); modalEl = null; }

function memberOptions(selectedId) {
  return members.map(m => `<option value="${esc(m.id)}" ${m.id === selectedId ? "selected" : ""}>${esc(m.name)}</option>`).join("");
}

/**
 * The "who is this about" field on a new record.
 *
 * `required` is for log entries and appointments, which are always about one
 * person: the field is drawn only when there are two or more to choose from,
 * and with one profile the record is theirs without asking. A visit or a task
 * may be for the whole household, so its field appears as soon as there is one
 * profile, and with only one it starts on Everyone: nobody chose that person by
 * looking at their list, and a chore stamped with them by default would vanish
 * from the second person's list the day they are added, with no way to move it
 * back. With two or more it starts on whoever is in view.
 */
function aboutField(id, { required }) {
  const active = activeProfiles(profiles);
  if (active.length < (required ? 2 : 1)) return "";
  const current = !required && active.length === 1 ? "" : (inView()?.id ?? "");
  const first = required
    ? `<option value="" disabled ${current ? "" : "selected"}>Choose…</option>`
    : `<option value="">Everyone</option>`;
  return `<div class="field"><label for="${id}">${required ? "About" : "For"}</label><select id="${id}" ${required ? "required" : ""}>${first}${active.map(r => `<option value="${esc(r.id)}" ${r.id === current ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select></div>`;
}
function aboutChoice(form, id) {
  const field = form[id];
  return field ? field.value : (inView()?.id ?? "");
}
// Says who a row is about, where the list mixes people.
function aboutTag(row, prefix = "") {
  if (!showsProfileTag(profiles, viewId())) return "";
  const name = profileName(profiles, row.profile_id);
  return name ? `<span class="pill" data-testid="about-tag">${esc(prefix + name)}</span>` : "";
}

/* ── visits ── */
function visitModal() {
  openModal(`
    <h2>Schedule a visit</h2>
    <form class="form" id="visit-form">
      <div class="two">
        <div class="field"><label for="v-date">Date</label><input id="v-date" type="date" value="${today()}" data-autofocus required></div>
        <div class="field"><label for="v-time">Time</label><input id="v-time" type="time" value="10:00"></div>
      </div>
      <div class="field"><label for="v-who">Who is visiting</label><select id="v-who">${memberOptions(me?.id)}</select></div>
      ${aboutField("v-for", { required: false })}
      <div class="field"><label for="v-note">Note</label><input id="v-note" placeholder="What's planned"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn">Schedule</button>
      </div>
    </form>`);
}
async function submitVisit(form) {
  const date = form["v-date"].value; if (!date) return;
  const whoId = form["v-who"].value;
  const btn = modalEl.querySelector(".btn[type=submit]"); btn.disabled = true; btn.textContent = "Saving…";
  const row = { id: uid("v"), profile_id: aboutChoice(form, "v-for"), date, time: form["v-time"].value, member_id: whoId, member_name: memberName(whoId), note: form["v-note"].value.trim(), created_by: me.id, created_at: nowIso() };
  try {
    if (DB) await db(`INSERT INTO app_elder_care__visits (id, profile_id, date, time, member_id, member_name, note, created_by, created_at) VALUES (?,?,?,?,?,?,?,?,?)`,
      [row.id, row.profile_id, row.date, row.time, row.member_id, row.member_name, row.note, row.created_by, row.created_at]);
    visits = [...visits, row].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    closeModal(); render();
    publish("elder_care.visit_scheduled", {
      date: row.date, member_id: row.member_id, source_ref_id: calendarRef("visit", row.id),
    });
  } catch (e) { btn.disabled = false; btn.textContent = "Schedule"; showError(e.message); }
}

/* ── tasks ── */
function taskModal() {
  openModal(`
    <h2>New care task</h2>
    <form class="form" id="task-form">
      <div class="field"><label for="t-title">Task</label><input id="t-title" placeholder="e.g. Call the pharmacy" data-autofocus required></div>
      <div class="field"><label for="t-detail">Details</label><textarea id="t-detail" placeholder="Anything the helper should know"></textarea></div>
      <div class="two">
        <div class="field"><label for="t-who">Assign to</label><select id="t-who"><option value="">Unassigned</option>${memberOptions()}</select></div>
        <div class="field"><label for="t-due">Due</label><input id="t-due" type="date"></div>
      </div>
      ${aboutField("t-for", { required: false })}
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn">Add task</button>
      </div>
    </form>`);
}
async function submitTask(form) {
  const title = form["t-title"].value.trim(); if (!title) { form["t-title"].focus(); return; }
  const whoId = form["t-who"].value;
  const btn = modalEl.querySelector(".btn[type=submit]"); btn.disabled = true; btn.textContent = "Saving…";

async function deleteAppt(id) {

    : `<input id="pr-${f.key}" type="${f.type ?? "text"}" ${f.type === "date" ? `max="${today()}"` : ""} placeholder="${esc(f.placeholder ?? "")}" value="${esc(r?.[f.key] ?? "")}">`}</div>`;

        <span class="hint">Choose them if they are a member here themselves.</span>

// What the profile form showed when it opened. An edit is whatever differs
// from THIS, not from the stored row: the browser normalises what a control
// holds (a date input blanks a value that is not a date, a textarea rewrites
// line endings), and judged against the row those would read as edits the
// person never made and be written back over the stored value.
let profileFormOpened = null;
function readProfileForm(form) {
  const values = { name: form["pr-name"].value.trim(), member_id: form["pr-member"].value || null };
  for (const f of PROFILE_FIELDS) values[f.key] = form[`pr-${f.key}`].value.trim();
  return values;
}
async function submitProfile(form) {
  const name = form["pr-name"].value.trim(); if (!name) { form["pr-name"].focus(); return; }
  const id = form.dataset.profileId;
  const before = id ? profiles.find(x => x.id === id) : null;
  if (id && !before) { closeModal(); return; }
  const after = readProfileForm(form);
  const btn = modalEl.querySelector(".btn[type=submit]"); btn.disabled = true; btn.textContent = "Saving…";
  const now = nowIso();
  try {
    if (before) {
      // Only what this person changed, so a sibling's save from an older copy
      // of the profile cannot put back the fields someone else just edited.
      const changed = profileChanges(profileFormOpened ?? before, after);
      const cols = Object.keys(changed);
      if (cols.length) {
        if (DB) await db(`UPDATE app_elder_care__profiles SET ${cols.map(c => `${c} = ?`).join(", ")}, updated_at = ? WHERE id = ?`,
          [...cols.map(c => changed[c]), now, id]);
        Object.assign(before, changed, { updated_at: now });
      }
    } else {
      const row = { id: uid("p"), ...after, archived_at: "", created_by: me.id, created_at: now, updated_at: now };
      if (DB) await db(`INSERT INTO app_elder_care__profiles (id, name, member_id, ${PROFILE_FIELDS.map(f => f.key).join(", ")}, archived_at, created_by, created_at, updated_at) VALUES (?,?,?,${PROFILE_FIELDS.map(() => "?").join(",")},?,?,?,?)`,
        [row.id, row.name, row.member_id, ...PROFILE_FIELDS.map(f => row[f.key]), row.archived_at, row.created_by, row.created_at, row.updated_at]);
      profiles = [...profiles, row];
      selectedProfileId = row.id;
    }
    closeModal(); render();
  } catch (e) {
    btn.disabled = false; btn.textContent = "Save";
    // In the form, not on the page behind it: this form is taller than the
    // screen on a phone, and the page's own error line would sit out of sight.
    const box = modalEl.querySelector("#profile-error");
    box.textContent = /unique/i.test(e.message) ? "That member already has a profile here." : e.message;
    box.hidden = false; box.scrollIntoView({ block: "nearest" });
  }
}
// Archived, never deleted: every record that names this person keeps a person
// to name, and the profile comes back with one tap.
async function setProfileArchived(id, archived) {
  const r = profiles.find(x => x.id === id); if (!r) return;
  if (archived && !(await hubConfirm({ message: `Archive ${r.name}'s profile?`, description: "Their visits, tasks, appointments and log entries are kept, and you can restore the profile at any time.", confirmLabel: "Archive" }))) return;
  const now = nowIso();
  const archived_at = archived ? now : "";
  try {
    if (DB) await db(`UPDATE app_elder_care__profiles SET archived_at = ?, updated_at = ? WHERE id = ?`, [archived_at, now, id]);
    r.archived_at = archived_at; r.updated_at = now;
    if (archived && selectedProfileId === id) selectedProfileId = "";
    render();
  } catch (e) { showError(e.message); }
}
// Log entries and appointments written before anyone had a profile name
// nobody, and so show under everyone. This settles them in one step.
async function assignUntagged(id) {
  const r = profiles.find(x => x.id === id); if (!r) return;
  if (!(await hubConfirm({ message: `Are they all about ${r.name}?`, description: `Every log entry and appointment that names nobody will be marked as being about ${r.name}.`, confirmLabel: "Yes, mark them" }))) return;
  // A history load still in flight would replace both lists with rows read
  // before these updates, and bring the unnamed entries back on screen.
  if (historyPromise && !historyLoaded) await historyPromise.catch(() => {});
  try {
    // Each list is patched as soon as its own statement lands, so a failure on
    // the second leaves the screen showing exactly what was saved.
    if (DB) await db(`UPDATE app_elder_care__observations SET profile_id = ? WHERE profile_id = ''`, [id]);
    for (const o of observations) if (!o.profile_id) o.profile_id = id;
    if (DB) await db(`UPDATE app_elder_care__appointments SET profile_id = ? WHERE profile_id = ''`, [id]);
    for (const a of appointments) if (!a.profile_id) a.profile_id = id;
    render();
  } catch (e) { showError(e.message); }
}

function renderProfile() {
  const active = activeProfiles(profiles);
  const archived = archivedProfiles(profiles);
  const shown = inView();
  const addBtn = label => canEdit() ? `<button class="btn btn-sm" data-add="profile">${label}</button>` : "";
  let body;
  if (shown) {
    body = profileCardHtml(shown);
    // Only once there is someone else they could be about. With one profile
    // an unnamed record already reads as theirs, and there is nothing to settle.
    if (canEdit() && profiles.length > 1 && untaggedCount(observations, appointments) > 0) {
      body += `
        <div class="card stack" style="gap:8px" data-testid="untagged">
          <div>Some log entries and appointments name nobody, so they show under everyone.</div>
          <div class="actions"><button class="btn btn-ghost btn-sm" data-assign-untagged="${esc(shown.id)}">They are all about ${esc(shown.name)}</button></div>
        </div>`;
    }
  } else if (active.length) {
    body = active.map(r => `
      <div class="card row-card" data-testid="profile-summary" data-profile-id="${esc(r.id)}">
        <div>
          <strong>${esc(r.name)}</strong>
          ${profileEntries(r, today()).filter(e => !e.long).slice(0, 2).map(e => `<div class="meta">${esc(e.value)}</div>`).join("")}
        </div>
        <button class="btn btn-ghost btn-sm" data-profile="${esc(r.id)}">Open</button>
      </div>`).join("");
  } else {
    body = `<div class="card empty"><div>${chickadee("nest", { size: 72 })}</div>${archived.length
      ? "Every profile is archived."
      : canEdit()
        ? "Add the person you are caring for. Their profile keeps what everyone helping should know, and each visit, task, appointment and log entry can say who it is about."
        : "No profile has been added yet."}</div>`;
  }
  return `
    <div class="section-head"><h2>${active.length > 1 && !shown ? "Profiles" : "Profile"}</h2>${addBtn(profiles.length ? "Add another person" : "Add a person")}</div>
    <div class="stack">
      ${body}
      ${archived.length ? `<div class="section-head" style="margin-top:8px"><h3 class="muted">Archived</h3></div>${archived.map(r => `
        <div class="card row-card done" data-testid="archived-profile" data-profile-id="${esc(r.id)}">
          <strong>${esc(r.name)}</strong>
          ${canEdit() ? `<button class="btn btn-ghost btn-sm" data-restore-profile="${esc(r.id)}">Restore</button>` : ""}
        </div>`).join("")}` : ""}
    </div>`;
}

// The switcher. Drawn only when there are two or more people to tell apart.
function profileChipsHtml() {
  const active = activeProfiles(profiles);
  if (active.length < 2) return "";
  const view = viewId();
  const chip = (id, label) => `<button class="chip ${view === id ? "active" : ""}" data-testid="profile-chip" data-profile="${esc(id)}" aria-pressed="${view === id}">${esc(label)}</button>`;
  return `<div class="chips" role="group" aria-label="Whose care to show">${chip("", "Everyone")}${active.map(r => chip(r.id, r.name)).join("")}</div>`;
}

const TABS = [
  { id: "schedule", label: "Schedule" },
  { id: "tasks", label: "Tasks" },
  { id: "appointments", label: "Appointments" },
  { id: "log", label: "Log" },
  { id: "profile", label: "Profile" },
];

function render() {
  const root = document.getElementById("root");
  root.className = "app-root";
  if (loadFailed) {
    root.innerHTML = `
      <div class="topbar">
        <div><h1>${glyph("hand-heart")} Elder Care</h1><p class="muted tiny">Coordinate care for someone you love.</p></div>
      </div>
      <div class="load-error" data-testid="load-error" role="alert"><span>Couldn’t load the care record.</span> <button type="button" class="load-error-retry" data-testid="load-retry">Try again</button></div>`;
    return;
  }
  const body = tab === "schedule" ? renderSchedule() : tab === "tasks" ? renderTasks() : tab === "appointments" ? renderAppointments() : tab === "profile" ? renderProfile() : renderLog();
  const active = activeProfiles(profiles);
  root.innerHTML = `
    <div class="topbar">
      <div><h1>${glyph("hand-heart")} Elder Care</h1><p class="muted tiny">${active.length === 1 ? `Caring for ${esc(active[0].name)}.` : "Coordinate care for someone you love."}</p></div>
    </div>
    ${error ? `<div class="error">${esc(error)}</div>` : ""}
    ${profileChipsHtml()}
    <div class="tabs">${TABS.map(t => `<button class="tab ${tab === t.id ? "active" : ""}" data-tab="${t.id}">${t.label}</button>`).join("")}</div>
    ${body}
    ${tab === "log" || tab === "profile" ? "" : earlierHistoryHtml()}`;
}

// Re-render only the list on each keystroke so the search box keeps focus.
document.addEventListener("input", (e) => {
  if (e.target.id !== "search") return;
  searchQ = e.target.value;
  // Notes are encrypted at rest, so this match runs client-side over loaded
  // rows. Searching a windowed set would report "no observations match" about
  // records that exist, which is a false negative on someone's care record.
  if (searchQ && !historyLoaded) loadFullHistory().then(render).catch(() => render());
  const el = document.getElementById("observation-list");
  if (el) el.innerHTML = renderObservationList();
});

document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-tab]");
  if (!t) return;
  if (t.dataset.testid === "load-retry") { init(); return; }
  if (t.dataset.tab) { tab = t.dataset.tab; error = ""; render(); return; }
  if (t.dataset.profile !== undefined) { selectedProfileId = t.dataset.profile; error = ""; render(); return; }
  if (t.dataset.loadHistory !== undefined) {
    t.disabled = true; t.textContent = "Loading…";
    loadFullHistory().then(render).catch(() => render());
    return;
  }
  if (t.dataset.close !== undefined) { closeModal(); return; }
  const add = t.dataset.add;
  if (add === "visit") return visitModal();
  if (add === "task") return taskModal();
  if (add === "appt") return apptModal();
  if (add === "obs") return obsModal();
  if (add === "profile") return profileModal("");
  if (t.dataset.editProfile) return profileModal(t.dataset.editProfile);
  if (t.dataset.archiveProfile) return setProfileArchived(t.dataset.archiveProfile, true);
  if (t.dataset.restoreProfile) return setProfileArchived(t.dataset.restoreProfile, false);
  if (t.dataset.assignUntagged) return assignUntagged(t.dataset.assignUntagged);
  if (t.dataset.toggle) return toggleTask(t.dataset.toggle);
  if (t.dataset.delTask) return deleteTask(t.dataset.delTask);
  if (t.dataset.delVisit) return deleteVisit(t.dataset.delVisit);
  if (t.dataset.delAppt) return deleteAppt(t.dataset.delAppt);
  if (t.dataset.delObs) return deleteObs(t.dataset.delObs);
  if (t.dataset.claim) return claimAppt(t.dataset.claim);
});

document.addEventListener("change", e => {
  const cb = e.target.closest("[data-toggle]");
  if (cb) toggleTask(cb.dataset.toggle);
});

document.addEventListener("submit", e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === "visit-form") submitVisit(e.target);
  else if (id === "task-form") submitTask(e.target);
  else if (id === "appt-form") submitAppt(e.target);
  else if (id === "obs-form") submitObs(e.target);
  else if (id === "profile-form") submitProfile(e.target);
});

async function deleteVisit(id) {
  if (!(await hubConfirm({ message: "Remove this visit?", destructive: true, confirmLabel: "Remove" }))) return;
  try {
    if (DB) await db(`DELETE FROM app_elder_care__visits WHERE id = ?`, [id]);
    visits = visits.filter(x => x.id !== id); render();
  } catch (e) { showError(e.message); return; }
  // Same ordering and the same unconditional publish as the appointment
  // path above, for the same reasons.
  await publishRetraction("elder_care.visit_cancelled", { source_ref_id: calendarRef("visit", id) });
}

init();
</script>
</body>
</html>
