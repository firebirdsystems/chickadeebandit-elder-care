<body>
<div class="app"><div id="root" class="loading">Loading…</div></div>

<script type="module">
import { esc, isAdult, memberColor, initial, hubConfirm, searchMatch, hubToday as today, glyph, chickadee } from "/hub-sdk.js";
import {
  CATEGORIES, fmtDate, fmtWhen, memberName as memberNameOf, catOf,
  scheduleList, appointmentList, openTasks, doneTasks, searchableFields, calendarRef,
  PROFILE_FIELDS, activeProfiles, archivedProfiles, viewProfileId, profileInView,
  forProfile, showsProfileTag, profileName, linkableMembers, untaggedCount,
  profileEntries, profileChanges,
  VITAL_KINDS, vitalKind, vitalUnits, canLogVitals, parseReading, fmtReading, vitalsFor,
  readingsByKind, defaultUnit, trendSeries, sparkline, toLocalInput, localInputToIso,
  VITALS_CURSOR_START, nextVitalsCursor, mergeOlderVitals, ownReading, canDeleteReading,
  createResettableLoad, readWhenQuiet, readAllPages, sortByDateTime, sortTasks, sortObservations, defaultRecordRange, recordRangeError, recordUrl,
  isGuest, helpsHandsOn, logsOwnReading, sortShifts, runningShift, canEditShift, shiftLength, shiftTimesError, latestHandoff,
  NOTE_AUDIENCES, isFamilyOnly, canEditReading, shiftChanges, fieldConflicts, mergeNote, nextRevision,
  withStoredRow,
} from "./logic.js";

const CONTEXT = window.__CONTEXT_URL ?? "";
const DB = window.__DB_URL ?? "";
const EVENTS_URL = window.__EVENTS_URL ?? "/api/events";
const APP_ID = window.__APP_ID ?? "elder-care";
const HUB_MEMBER = window.__CURRENT_MEMBER ?? null;
const REPORTS_URL = window.__REPORTS_URL ?? "";

let members = [], memberMap = new Map(), me = null;
let visits = [], tasks = [], appointments = [], observations = [], shifts = [];
// The people being cared for, and which one the lists are narrowed to ("" for
// everyone). See logic.js for what the selection means with one profile, or none.
let profiles = [];
let selectedProfileId = "";
let tab = "schedule";
let searchQ = "";       // in-app search (see logic.js searchableFields)
let error = "";
let loadFailed = false; // the first load failed: nothing is known, so nothing is shown as empty
let modalEl = null;

function nowIso() { return new Date().toISOString(); }
function uid(p) { return `${p}-${crypto.randomUUID()}`; }
function memberName(id) { return memberNameOf(memberMap, id); }
function canEdit() { return isAdult(me); }
// Adults, and a guest: the family's paid caregiver. What they are offered is the
// narrow set the hub lets a member who is not an adult write. See logic.js.
function handsOn() { return helpsHandsOn(me, isAdult(me)); }
function viewId() { return viewProfileId(profiles, selectedProfileId); }
function inView() { return profileInView(profiles, selectedProfileId); }

// Moves when a write starts and again when it ends, whatever the outcome. A read
// that is going to replace the lists compares it before and after: see
// readWhenQuiet in logic.js.
let writeVersion = 0;
async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const write = !/^\s*(select|with)\b/i.test(sql);
  if (write) writeVersion++;
  try {
    const res = await fetch(DB, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sql, params }) });
    const json = await res.json().catch(() => null);
    if (!res.ok || !json || typeof json !== "object" || json.error) throw new Error(json?.error || "Couldn’t reach the hub. Try again.");
    return json;
  } finally {
    if (write) writeVersion++;
  }
}

// Wording this app wrote for the reader is marked where it is thrown. A failed
// write shows that wording, or the one fixed line for the action: never the
// hub's own error text, which goes to the console.
function userError(msg) { return Object.assign(new Error(msg), { forUser: true }); }
function failText(e, line) { if (!e?.forUser) console.error(e); return e?.forUser ? e.message : line; }

// A write the hub narrowed to nothing answers success with zero rows. The row
// is then read again, so the list can show what is stored instead of what was
// asked for: the row as it is now, or `null` when it is gone. `undefined` when
// this read fails too, or answers without a list of rows: the list is then left
// alone (see withStoredRow) and the caller shows its plain try-again line.
async function storedRow(table, id) {
  try {
    const { rows } = await db(`SELECT * FROM app_elder_care__${table} WHERE id = ?`, [id]);
    return Array.isArray(rows) ? rows[0] ?? null : undefined;
  } catch (e) { console.error(e); return undefined; }
}

async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "demo-1", name: "Dana", role: "adult" },
      { id: "demo-2", name: "Sam", role: "adult" },
      { id: "demo-3", name: "Pat", role: "adult" },
    ];
  } else {
    // A failed read throws: it is a failed load, never a household of nobody.
    // A 200 that names the key in `$errors` is the hub saying it could not read it.
    const res = await fetch(`${CONTEXT}?keys=family.members`);
    const data = await res.json().catch(() => null);
    if (!res.ok || data === null || typeof data !== "object" || Array.isArray(data)) throw new Error("Couldn’t reach the hub. Try again.");
    if (Array.isArray(data.$errors) && data.$errors.includes("family.members")) throw new Error("Couldn’t reach the hub. Try again.");
    members = data["family.members"] ?? [];
  }
  memberMap = new Map(members.map(m => [m.id, m]));
  me = HUB_MEMBER ?? members[0] ?? { id: "guest", name: "Guest", role: "adult" };
}

function seedDemo() {
  const profile = (id, name, fields) => ({
    id, name, member_id: null, ...Object.fromEntries(PROFILE_FIELDS.map(f => [f.key, ""])), ...fields,
    archived_at: "", created_by: "demo-1", created_at: nowIso(), updated_at: nowIso(),
  });
  profiles = [
    profile("p1", "Mom", { born_on: "1944-03-09", residence: "At home on Alder Street", primary_doctor: "Dr. Reyes, 555-0142", diagnoses: "High blood pressure\nArthritis in both knees", mobility: "Uses a cane outdoors. Needs a hand on the stairs.", baseline: "Up by seven, reads the paper, walks to the corner after lunch." }),
    profile("p2", "Dad", { born_on: "1941-11-22", residence: "At home on Alder Street", cognition: "Forgets recent conversations. Knows everyone." }),
  ];
  const ago = days => new Date(Date.now() - days * 86_400_000).toISOString();
  const reading = (id, kind, value, value2, unit, days) => ({ id, profile_id: "p1", kind, value, value2, unit, note: "", measured_at: ago(days), recorded_by: "demo-1", created_at: ago(days) });
  vitals = [
    reading("x1", "bp", "128", "82", "mmHg", 0), reading("x2", "bp", "134", "86", "mmHg", 3), reading("x3", "bp", "141", "88", "mmHg", 7), reading("x4", "bp", "138", "84", "mmHg", 12),
    reading("x5", "weight", "148", "", "lb", 1), reading("x6", "weight", "149.5", "", "lb", 8), reading("x7", "weight", "151", "", "lb", 15),
    reading("x8", "appetite", "4", "", "of 5", 0),
  ];
  visits = [
    { id: "v1", profile_id: "", date: today(), time: "10:00", member_id: "demo-1", member_name: "Dana", note: "Morning check-in, breakfast", created_by: "demo-1", created_at: nowIso() },
    { id: "v2", profile_id: "p1", date: today(), time: "18:00", member_id: "demo-2", member_name: "Sam", note: "Dinner and meds", created_by: "demo-2", created_at: nowIso() },
  ];
  tasks = [
    { id: "t1", profile_id: "p1", title: "Call Dr. Reyes about the new prescription", detail: "Ask if it can be taken with breakfast.", assignee_id: "demo-3", assignee_name: "Pat", due_date: today(), status: "open", created_by: "demo-1", created_by_name: "Dana", created_at: nowIso(), completed_at: "" },
    { id: "t2", profile_id: "", title: "Refill blood pressure meds", detail: "", assignee_id: "demo-2", assignee_name: "Sam", due_date: "", status: "done", created_by: "demo-2", created_by_name: "Sam", created_at: nowIso(), completed_at: nowIso() },
  ];
  appointments = [
    { id: "a1", profile_id: "p1", title: "Cardiology follow-up", provider: "Dr. Reyes", date: today(), time: "14:30", location: "Mercy Clinic, Suite 210", accompanied_by_id: "demo-1", accompanied_by_name: "Dana", notes: "Bring the medication list.", created_by: "demo-1", created_at: nowIso() },
  ];
  shifts = [
    { id: "s1", member_id: "demo-3", member_name: "Pat", profile_id: "p1", started_at: ago(1.2), ended_at: ago(1), shift_date: today(), summary: "Breakfast, a short walk, laundry.", handoff: "Ate little at lunch. The afternoon tablets are still in the box.", visibility: "everyone", created_at: ago(1.2), updated_at: ago(1) },
  ];
  observations = [
    { id: "o1", profile_id: "p2", member_id: "demo-2", member_name: "Sam", category: "mood", note: "In good spirits today, enjoyed the walk.", observed_at: nowIso(), created_at: nowIso() },
    { id: "o2", profile_id: "p1", member_id: "demo-1", member_name: "Dana", category: "health", note: "Slight swelling in ankles, keeping an eye on it.", observed_at: nowIso(), created_at: nowIso() },
  ];
}

async function loadData() {
  if (!DB) { seedDemo(); return; }
  // Each read is windowed so the per-launch scan stays bounded as years of
  // care history accrue. Visits/appointments keep 30 days of past rows so the
  // no-upcoming fallback still shows something recent; tasks keep every open
  // row (completed_at = '') plus 120 days of completed ones; observations keep
  // a 120-day feed; shifts keep 30 days and whatever is still running. The date param is the household-local day so the hub's
  // `:today` preload binding matches this text. Profiles are read whole: the
  // table grows with the people being cared for, not with time.
  const [v, t, a, o, r, s] = await Promise.all([
    db("SELECT * FROM app_elder_care__visits WHERE date >= date(?, '-30 days') ORDER BY date ASC, time ASC", [today()]),
    db("SELECT * FROM app_elder_care__tasks WHERE completed_at = '' OR completed_at >= date(?, '-120 days') ORDER BY (status = 'done'), (due_date = ''), due_date ASC, created_at DESC", [today()]),
    db("SELECT * FROM app_elder_care__appointments WHERE date >= date(?, '-30 days') ORDER BY date ASC, time ASC", [today()]),
    db("SELECT * FROM app_elder_care__observations WHERE observed_at >= date(?, '-120 days') ORDER BY observed_at DESC", [today()]),
    db("SELECT * FROM app_elder_care__profiles ORDER BY created_at ASC"),
    // Every shift still running, however long ago it started, so one nobody
    // ended does not drop out of sight with its End button.
    db("SELECT * FROM app_elder_care__shifts WHERE ended_at = '' OR started_at >= date(?, '-30 days') ORDER BY started_at DESC, id DESC", [today()]),
  ]);
  visits = v.rows; tasks = t.rows; appointments = a.rows; observations = o.rows; profiles = r.rows; shifts = s.rows;
}

// ── Earlier history ────────────────────────────────────────────────────────
//
// The windows above bound the LAUNCH read; they must not bound what the family
// can see. None of these tables declares retain_days, so every row older than
// its window is still stored — it was simply unreachable, with nothing on
// screen saying so. In a care app that is the wrong trade to make silently: the
// observation log and the visit history are exactly the record someone goes
// back through to answer "when did this start?" or "how often did we come?".
//
// So the older rows load on demand: when a person asks for them, and whenever
// the observation search runs — search matches note text, which is encrypted at
// rest and can only be compared client-side, so a windowed search would quietly
// answer "no results" about records that exist. The promise is the guard, so
// repeated keystrokes cannot start a second read.
// Log entries carry free text, so a page is kept well under the hub's 2 MiB
// answer limit as well as its row limit.
const HISTORY_PAGE = 500;
const HISTORY_TABLES = ["visits", "tasks", "appointments", "observations", "shifts"];
const historyPage = table => after => db(`SELECT * FROM app_elder_care__${table} WHERE id > ? ORDER BY id LIMIT ${HISTORY_PAGE}`, [after]).then(r => r.rows);
let historyLoaded = false;
let historyError = false;
let historyPromise = null;
function loadFullHistory() {
  if (!DB || historyLoaded) return Promise.resolve();
  // Editing stays available while this is out, so a read that a save, a tick
  // or a delete overlapped is not used: replacing the lists with it could take
  // that change back off the screen. It is read again once the write is done.
  // Each table is read whole, but a page at a time: one request for all of it
  // fails for good once the table passes the hub's row or size ceiling.
  historyPromise ??= readWhenQuiet(() => Promise.all(HISTORY_TABLES.map(table => readAllPages(historyPage(table), HISTORY_PAGE))), () => writeVersion)
    .then(([v, t, a, o, s]) => {
      // Replace rather than append: every row of each table is here, so there
      // is no merge to get wrong and no chance of a duplicate. Sorted here, into
      // the order the launch reads use, because the pages come in id order.
      visits = sortByDateTime(v); tasks = sortTasks(t); appointments = sortByDateTime(a); observations = sortObservations(o); shifts = sortShifts(s);
      historyLoaded = true;
      historyError = false;
    })
    .catch((e) => { historyPromise = null; historyError = true; throw e; });
  return historyPromise;
}

function earlierHistoryHtml() {
  if (historyLoaded) return "";
  if (historyError) return `<div class="card empty">Earlier history could not be loaded. <button class="btn btn-ghost btn-sm" data-load-history>Try again</button></div>`;
  return `<button class="btn btn-ghost btn-sm" data-load-history style="width:100%;margin-top:12px">Show earlier history</button>`;
}

// A caregiver opens the app to start a shift or read the last handoff, so that
// is the tab they land on. Once, so a retry after a failed load does not move
// someone who has already chosen a tab.
let landed = false;
async function init() {
  try {
    await Promise.all([loadMembers(), loadData()]);
    loadFailed = false;
    if (!landed) { landed = true; if (isGuest(me)) tab = "shifts"; }
    render();
  }
  catch { loadFailed = true; render(); }
}

function postEvent(type, payload) {
  return fetch(EVENTS_URL, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ source_app_id: APP_ID, type, payload }) });
}

/**
 * Announcements. Fire-and-forget on purpose: a dropped `..._added` costs a
 * calendar entry that was never made, and the row is here to be seen either
 * way. Nothing downstream is left saying something untrue.
 */
function publish(type, payload) {
  postEvent(type, payload).catch(() => {});
}

/**
 * Retractions, which are NOT interchangeable with the above. A dropped
 * retraction leaves a calendar entry telling whoever is driving to be
 * somewhere for an appointment that no longer exists — the exact failure the
 * retraction exists to prevent, and one nothing else will ever notice, because
 * the row it disagreed with is gone. So: awaited, retried once (the usual
 * cause is a transient network blip on a page that is about to be closed), and
 * on final failure said out loud, since a person who knows the calendar is
 * stale can go clear it and a person who doesn't cannot.
 */
async function publishRetraction(type, payload) {
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const res = await postEvent(type, payload);
      if (res.ok) return true;
      // 4xx is a verdict, not a blip — the ACL rejected us, or the payload is
      // wrong. Retrying sends the identical request to the identical answer.
      if (res.status < 500) break;
    } catch { /* network failure — worth the one retry below */ }
  }
  showError("Removed here, but the calendar entry it created could not be taken down. Check the calendar.");
  return false;
}

/* ── modal ── */
function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  const first = modalEl.querySelector("[data-autofocus]");
  if (first) first.focus();
}
function closeModal() { modalEl?.remove(); modalEl = null; }

function memberOptions(selectedId) {
  return members.map(m => `<option value="${esc(m.id)}" ${m.id === selectedId ? "selected" : ""}>${esc(m.name)}</option>`).join("");
}

/**
 * The "who is this about" field on a new record.
 *
 * `required` is for log entries and appointments, which are always about one
 * person: the field is drawn only when there are two or more to choose from,
 * and with one profile the record is theirs without asking. A visit or a task
 * may be for the whole household, so its field appears as soon as there is one
 * profile, and with only one it starts on Everyone: nobody chose that person by
 * looking at their list, and a chore stamped with them by default would vanish
 * from the second person's list the day they are added, with no way to move it
 * back. With two or more it starts on whoever is in view.
 */
function aboutField(id, { required }) {
  const active = activeProfiles(profiles);
  if (active.length < (required ? 2 : 1)) return "";
  const current = !required && active.length === 1 ? "" : (inView()?.id ?? "");
  const first = required
    ? `<option value="" disabled ${current ? "" : "selected"}>Choose…</option>`
    : `<option value="">Everyone</option>`;
  return `<div class="field"><label for="${id}">${required ? "About" : "For"}</label><select id="${id}" ${required ? "required" : ""}>${first}${active.map(r => `<option value="${esc(r.id)}" ${r.id === current ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select></div>`;
}
function aboutChoice(form, id) {
  const field = form[id];
  return field ? field.value : (inView()?.id ?? "");
}
// Says who a row is about, where the list mixes people.
function aboutTag(row, prefix = "") {
  if (!showsProfileTag(profiles, viewId())) return "";
  const name = profileName(profiles, row.profile_id);
  return name ? `<span class="pill" data-testid="about-tag">${esc(prefix + name)}</span>` : "";
}

  try {

      [row.id, row.profile_id, row.title, row.detail, row.assignee_id, row.assignee_name, row.due_date, row.status, row.created_by, row.created_by_name, row.created_at, row.completed_at]);
    tasks = [row, ...tasks];

    publish("elder_care.task_created", { title: row.title, assignee_id: row.assignee_id });
  } catch (e) { btn.disabled = false; btn.textContent = "Add task"; showError(failText(e, "Couldn’t add the task — try again.")); }

async function toggleTask(id) {
  const t = tasks.find(x => x.id === id); if (!t) return;
  if (!handsOn()) return;
  const status = t.status === "done" ? "open" : "done";
  const completed_at = status === "done" ? nowIso() : "";
  // Who ticked it, cleared again when it is reopened. Status, time, and who are
  // the whole of what the hub lets a person who is not an adult write here.
  // Their name is kept beside the id: a guest's seat is removed when the job
  // ends, and the task should still say who did it.
  const completed_by = status === "done" ? (me?.id ?? "") : "";
  const completed_by_name = status === "done" ? (me?.name ?? "") : "";
  try {
    if (DB) {
      const res = await db(`UPDATE app_elder_care__tasks SET status = ?, completed_at = ?, completed_by = ?, completed_by_name = ? WHERE id = ?`, [status, completed_at, completed_by, completed_by_name, id]);
      // A tick the hub narrowed to nothing answers success with zero rows. The
      // task is read again, so the list shows what is stored.
      if (res.changed === 0) {
        const row = await storedRow("tasks", id);
        tasks = sortTasks(withStoredRow(tasks, id, row));
        throw row === undefined ? new Error("the task could not be read back after an update that changed nothing") : userError("That task could not be changed. It may have been removed.");
      }
    }
    // Looked up again: a history load can replace the list while the write is
    // out, and the row found before it is then no longer the one on screen.
    const now = tasks.find(x => x.id === id);
    if (now) { now.status = status; now.completed_at = completed_at; now.completed_by = completed_by; now.completed_by_name = completed_by_name; }
    render();
  } catch (e) { showError(failText(e, "Couldn’t update the task — try again.")); }
}
async function deleteTask(id) {
  if (!(await hubConfirm({ message: "Delete this task?", destructive: true, confirmLabel: "Delete" }))) return;
  try {
    if (DB) {
      const res = await db(`DELETE FROM app_elder_care__tasks WHERE id = ?`, [id]);
      // Zero rows and the row is gone: it is deleted, which is what was asked.
      // Zero rows and it is still there: the hub refused, and the row stays.
      // Zero rows and the read failed: not known, so the row stays and the
      // plain line is shown; trying again settles it.
      if (res.changed === 0) {
        const row = await storedRow("tasks", id);
        if (row !== null) {
          tasks = sortTasks(withStoredRow(tasks, id, row));
          throw row ? userError("That task could not be deleted. It may not be yours to remove.") : new Error("the task could not be read back after a delete that removed nothing");
        }
      }
    }
    tasks = tasks.filter(x => x.id !== id); render();
  } catch (e) { showError(failText(e, "Couldn’t delete the task — try again.")); }
}

async function claimAppt(id) {
  const a = appointments.find(x => x.id === id); if (!a || !me) return;
  try {
    if (DB) {
      // Only while nobody has it: a screen drawn before another adult took the
      // appointment must not replace their name with this one.
      const res = await db(`UPDATE app_elder_care__appointments SET accompanied_by_id = ?, accompanied_by_name = ? WHERE id = ? AND (accompanied_by_id = '' OR accompanied_by_id IS NULL)`, [me.id, me.name, id]);
      if (res.changed === 0) {
        const row = await storedRow("appointments", id);
        appointments = sortByDateTime(withStoredRow(appointments, id, row));
        // Already this person's, from a second tap: nothing to report.
        if (row?.accompanied_by_id === me.id) { render(); return; }
        throw row === undefined ? new Error("the appointment could not be read back after an update that changed nothing")
          : userError(row?.accompanied_by_id ? "Someone is already taking them to that appointment." : "That appointment could not be changed. It may have been removed, or it is not yours to change.");
      }
    }
    // Looked up again, for the same reason as in toggleTask.
    const now = appointments.find(x => x.id === id);
    if (now) { now.accompanied_by_id = me.id; now.accompanied_by_name = me.name; }
    render();
  } catch (e) { showError(failText(e, "Couldn’t update the appointment — try again.")); }
}
async function deleteAppt(id) {
  if (!(await hubConfirm({ message: "Remove this appointment?", destructive: true, confirmLabel: "Remove" }))) return;
  try {
    if (DB) {
      const res = await db(`DELETE FROM app_elder_care__appointments WHERE id = ?`, [id]);
      // Zero rows and the row is gone: it is removed, and the retraction below
      // is still sent, since nothing says the delete that removed it sent one.
      // Zero rows and it is still there: the hub refused; thrown, so nothing is
      // retracted for an appointment that is still here.
      if (res.changed === 0) {
        const row = await storedRow("appointments", id);
        if (row !== null) {
          appointments = sortByDateTime(withStoredRow(appointments, id, row));
          throw row ? userError("That appointment could not be removed. It may not be yours to remove.") : new Error("the appointment could not be read back after a delete that removed nothing");
        }
      }
    }
    appointments = appointments.filter(x => x.id !== id); render();
  } catch (e) { showError(failText(e, "Couldn’t remove the appointment — try again.")); return; }
  // After the row is gone, so a failed delete never retracts an entry for an
  // appointment that is still here. Carries the same reference the announcement
  // did — that is what lets a rule find the one calendar entry this made.
  //
  // Deliberately NOT behind `if (DB)`: the announcement in submitAppt is not
  // either, so a context with no database still produced a calendar entry, and
  // that entry still needs taking down.
  await publishRetraction("elder_care.appointment_cancelled", { source_ref_id: calendarRef("appt", id) });
}

/* ── vitals ── */
// Read when the Vitals tab is first opened, not at launch: no other screen
// needs a reading, and these tables grow faster than any other in the app.
//
// Two tables hold readings (see migrations/005 and 006): what was recorded for
// a person, by an adult or by the family's caregiver, and what a person logged
// for themselves. Both are read together and shown as one list.
let vitals = [];
let openVitalKind = "";
const VITALS_PAGE = 2000;
const VITAL_SOURCES = [
  { table: "app_elder_care__vitals", own: false },
  { table: "app_elder_care__own_vitals", own: true },
];
// Self-logged readings are read only for members who have a profile. Any
// member may write that table, and only its writer can remove a row, so a
// read of the whole table would let one member's rows crowd out or break the
// tab for everybody with nothing an adult could do about it.
function linkedMemberIds() { return [...new Set(profiles.map(p => p.member_id).filter(Boolean))]; }
function vitalsScope(source) {
  if (!source.own) return { where: "", params: [] };
  const ids = linkedMemberIds();
  return { where: `member_id IN (${ids.map(() => "?").join(",")}) AND `, params: ids };
}
// Earlier readings come a page at a time. The hub refuses any answer over 5,000
// rows, and a person with several readings a day passes that within two years:
// one unbounded read would then fail on every tap, for good. The page is
// walked by (measured_at, id), so readings that share a time cannot stall it.
// The first read is a page too. Bounded only by the window, a person with many
// readings a day could put it over the hub's 5,000-row ceiling, and then the tab
// would offer nothing but a retry that fails the same way. A full first page
// simply leaves the rest of the window to "Show earlier readings", which
// carries on from the last row this returned.
const vitalsRecentSql = (source, scope) => `SELECT * FROM ${source.table} WHERE ${scope.where}measured_at >= date(?, '-120 days') ORDER BY measured_at DESC, id DESC LIMIT ${VITALS_PAGE}`;
const vitalsOlderSql = (source, scope) => `SELECT * FROM ${source.table} WHERE ${scope.where}measured_at <= ? AND (measured_at < ? OR id < ?) ORDER BY measured_at DESC, id DESC LIMIT ${VITALS_PAGE}`;
const vitalsLoad = { recent: false, error: false, sources: VITAL_SOURCES.map(source => ({ ...source, cursor: VITALS_CURSOR_START, done: false })) };
// Owns the read in flight. Its reset drops that read's result: see logic.js.
const vitalsRead = createResettableLoad();
function resetVitalsLoad() {
  // With no database there is nothing to read them back from: the demo's
  // readings, and any logged this session, are the only copy.
  if (!DB) return;
  vitalsRead.reset();
  vitals = [];
  vitalsLoad.recent = false; vitalsLoad.error = false;
  vitalsLoad.sources = VITAL_SOURCES.map(source => ({ ...source, cursor: VITALS_CURSOR_START, done: false }));
}
resetVitalsLoad();
function vitalsAllLoaded() { return vitalsLoad.sources.every(source => source.done); }
const fromSource = (source, rows) => (source.own ? rows.map(ownReading) : rows);
const NO_ROWS = Promise.resolve({ rows: [] });
// While a read is in flight the tab draws no controls (see renderVitals), so
// nothing can be logged or removed that the arriving rows would then undo.
// A read is applied only when every table answered, so a failure leaves the
// lists and both cursors exactly as they were for the retry.
function loadVitals(older) {
  if (!DB) return Promise.resolve();
  if (vitalsRead.busy) return vitalsRead.promise;
  if (vitalsAllLoaded() || (!older && vitalsLoad.recent)) return Promise.resolve();
  vitalsLoad.error = false;
  const pending = older ? vitalsLoad.sources.filter(source => !source.done) : vitalsLoad.sources;
  const read = () => Promise.all(pending.map(source => {
    const scope = vitalsScope(source);
    // Nobody linked means no self-logged reading can count: nothing to ask for.
    if (source.own && !scope.params.length) return NO_ROWS;
    return older
      ? db(vitalsOlderSql(source, scope), [...scope.params, source.cursor.at, source.cursor.at, source.cursor.id])
      : db(vitalsRecentSql(source, scope), [...scope.params, today()]);
  }));
  return vitalsRead.start(read, answers => {
    if (!older) vitals = [];
    answers.forEach((answer, i) => {
      const source = pending[i];
      const rows = fromSource(source, answer.rows);
      if (older) {
        const merged = mergeOlderVitals(vitals, rows, VITALS_PAGE);
        vitals = merged.vitals; source.done = merged.done;
      } else {
        vitals = [...vitals, ...rows];
      }
      source.cursor = nextVitalsCursor(older ? source.cursor : VITALS_CURSOR_START, rows);
    });
    vitalsLoad.recent = true;
  }, () => { vitalsLoad.error = true; });
}

// One form for a new reading and for correcting one. A correction is offered to

function vitalModal(editId = "") {
  const editing = editId ? vitals.find(x => x.id === editId && !x.own) : null;
  if (editId && !editing) return;
  const who = editing ? profiles.find(x => x.id === editing.profile_id) : inView();
  if (!who) return;
  if (editing ? !canEditReading(me, editing, isAdult(me)) : !canLogVitals(me, who, isAdult(me))) return;

      <div class="field"><label for="vt-note">Note</label><input id="vt-note" placeholder="After breakfast, left arm, felt dizzy"></div>

async function submitVital(form) {
  const box = form.querySelector("#vital-error");
  const fail = msg => { box.textContent = msg; box.hidden = false; box.scrollIntoView({ block: "nearest" }); };
  // The profile the form was opened for, not whoever is in view now.
  const who = profiles.find(x => x.id === form.dataset.profileId);
  const editId = form.dataset.readingId;
  const editing = editId ? vitals.find(x => x.id === editId && !x.own) : null;
  if (editId && !editing) { closeModal(); return; }
  if (!who || (editing ? !canEditReading(me, editing, isAdult(me)) : !canLogVitals(me, who, isAdult(me)))) { closeModal(); return; }
  const kindId = form["vt-kind"].value, unit = form["vt-unit"].value;
  const parsed = parseReading(kindId, unit, form["vt-value"].value, form["vt-value2"]?.value ?? "");
  if (!parsed.ok) return fail(parsed.error);
  // Left on its default, "When" means the moment the form opened, taken from
  // the clock and not from the text in the field. The text has no seconds and no
  // offset: in the hour a clock goes back it names two moments an hour apart,
  // and two readings in one minute would otherwise share a time exactly.
  const typedWhen = form["vt-when"].value;
  const measured_at = typedWhen === form.dataset.openedWhen ? form.dataset.openedAt : localInputToIso(typedWhen, Date.now());
  if (!measured_at) return fail("Choose a time that is not in the future.");
  const btn = modalEl.querySelector(".btn[type=submit]"); btn.disabled = true; btn.textContent = "Saving…";
  // The HOUSEHOLD's calendar day that moment fell on, like every other stored
  // date in the app: it is what the record's From and To are compared with. Not
  // the day in the field, which is this device's, and would file a reading and a
  // log entry made in the same minute under different days for a member away
  // from home. The device's day only when the SDK has no answer.
  const reading = { id: uid("x"), kind: kindId, value: parsed.value, value2: parsed.value2, unit, note: form["vt-note"].value.trim(), measured_at, measured_date: today(new Date(measured_at)) ?? typedWhen.slice(0, 10), created_at: nowIso() };

  // `own_vitals`: it has no profile column, so the row can only ever be theirs.
  // An adult and a caregiver write `vitals`, which names the profile. The hub
  // stamps both tables with the caller whatever this page sends.
  if (editing) {
    const fixed = { value: reading.value, value2: reading.value2, unit: reading.unit, note: reading.note, measured_at: reading.measured_at, measured_date: reading.measured_date };
    try {
      if (DB) {
        const res = await db(`UPDATE app_elder_care__vitals SET value = ?, value2 = ?, unit = ?, note = ?, measured_at = ?, measured_date = ? WHERE id = ?`,

        // success with zero rows when that leaves none.
        if (res.changed === 0) throw userError("That reading could not be changed. It may have been removed, or it is not yours to change.");
      }
      // Looked up again, for the same reason as in toggleTask.
      const current = vitals.find(x => x.id === editId && !x.own);
      if (current) Object.assign(current, fixed);

      closeModal(); render();
    } catch (e) { btn.disabled = false; btn.textContent = "Save"; fail(failText(e, "Couldn’t save the reading — try again.")); }
    return;
  }
  // The name goes beside the id the hub stamps, so the reading still says who
  // took it once that person's seat is gone.
  const row = logsOwnReading(me, who, isAdult(me))
    ? ownReading({ ...reading, member_id: me.id })
    : { ...reading, profile_id: who.id, recorded_by: me.id, recorded_by_name: me.name ?? "" };
  try {
    if (DB && row.own) await db(`INSERT INTO app_elder_care__own_vitals (id, member_id, kind, value, value2, unit, note, measured_at, measured_date, created_at) VALUES (?,?,?,?,?,?,?,?,?,?)`,
      [row.id, row.member_id, row.kind, row.value, row.value2, row.unit, row.note, row.measured_at, row.measured_date, row.created_at]);
    else if (DB) await db(`INSERT INTO app_elder_care__vitals (id, profile_id, kind, value, value2, unit, note, measured_at, measured_date, recorded_by, recorded_by_name, created_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?)`,
      [row.id, row.profile_id, row.kind, row.value, row.value2, row.unit, row.note, row.measured_at, row.measured_date, row.recorded_by, row.recorded_by_name, row.created_at]);

}
// Addressed by table as well as id: the two tables keep separate ids, and a

async function deleteVital(id, own) {

  try {
    if (DB) {

/* ── the record for a doctor visit ── */
// The hub renders these documents from the manifest's `reports`, as whoever

// binds every report for one date range into a single print-styled document.
// They open in a new tab: the document carries its own page, and a CSV arrives
// as a download.

// the tab was first drawn.

function loadRecords() {
  if (!REPORTS_URL || records.views || records.loading) return;
  records.loading = true; records.failed = false;
  fetch(REPORTS_URL, { headers: { Accept: "application/json" } })
    .then(res => { if (!res.ok) throw new Error(`reports ${res.status}`); return res.json(); })
    .then(body => { records.views = Array.isArray(body?.views) ? body.views : []; records.full = body?.full_record ?? null; })
    // A list that failed to load is not an empty list.
    .catch(() => { records.failed = true; })
    .finally(() => { records.loading = false; if (tab === "profile") render(); });
}
function openRecord(id, format) {
  if (!recordRangeEdited) ({ from: recordFrom, to: recordTo } = defaultRecordRange(today()));
  const problem = recordRangeError(recordFrom, recordTo);
  if (problem) { showError(problem); return; }
  // A complaint about the dates must not outlive the dates being put right.
  if (error) { error = ""; render(); }

}

  }
  if (!recordRangeEdited) ({ from: recordFrom, to: recordTo } = defaultRecordRange(today()));
  const button = (id, format, label, primary) => `<button class="btn btn-sm ${primary ? "" : "btn-ghost"}" data-report="${esc(id)}" data-format="${format}">${label}</button>`;
  return `${head}
    <div class="card stack" data-testid="record-card">

      <div class="two">

      <span class="hint">Medications are not in this record. They are kept in the Medications app, where whoever manages them can print the list.</span>
      ${records.full ? `<div class="actions">${button(records.full.id, "html", "Open the record", true)}</div>` : ""}
      ${records.views.length ? `<div>${records.views.map(v => `
        <div class="reading-row" data-testid="record-view" data-record="${esc(v.id)}">
          <div><strong>${esc(v.title)}</strong>${v.description ? `<div class="meta">${esc(v.description)}</div>` : ""}</div>
          <div class="actions" style="flex-wrap:nowrap">${button(v.id, "html", "Open")}${button(v.id, "csv", "CSV")}</div>
        </div>`).join("")}</div>` : ""}
    </div>`;
}

/* ── profiles ── */
function profileModal(id) {
  const r = id ? profiles.find(x => x.id === id) : null;
  if (id && !r) return;
  // A link to someone the member list no longer resolves must stay selectable.
  // Dropping it from the options would make "Not a member" the selected value,
  // and saving any other field would then quietly unlink the profile.
  const options = linkableMembers(members, profiles, r?.id ?? "");
  if (r?.member_id && !options.some(m => m.id === r.member_id)) options.push({ id: r.member_id, name: memberName(r.member_id) });
  const field = f => `<div class="field"><label for="pr-${f.key}">${f.label}</label>${f.long
    ? `<textarea id="pr-${f.key}" placeholder="${esc(f.placeholder ?? "")}">${esc(r?.[f.key] ?? "")}</textarea>`
    : `<input id="pr-${f.key}" type="${f.type ?? "text"}" ${f.type === "date" ? `max="${today()}"` : ""} placeholder="${esc(f.placeholder ?? "")}" value="${esc(r?.[f.key] ?? "")}">`}</div>`;
  openModal(`
    <h2>${r ? "Edit profile" : "Add a person"}</h2>
    <form class="form" id="profile-form" data-profile-id="${esc(r?.id ?? "")}">
      <div class="error" id="profile-error" hidden></div>
      <div class="field"><label for="pr-name">Name</label><input id="pr-name" placeholder="What the family calls them" value="${esc(r?.name ?? "")}" data-autofocus required></div>
      <div class="field">
        <label for="pr-member">Member</label>
        <select id="pr-member"><option value="">Not a member</option>${options.map(m => `<option value="${esc(m.id)}" ${m.id === r?.member_id ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select>
        <span class="hint">Choose them if they are a member here themselves.</span>
      </div>
      ${PROFILE_FIELDS.map(field).join("")}
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn">Save</button>
      </div>
    </form>`);
  profileFormOpened = readProfileForm(modalEl.querySelector("#profile-form"));
}
// What the profile form showed when it opened. An edit is whatever differs
// from THIS, not from the stored row: the browser normalises what a control
// holds (a date input blanks a value that is not a date, a textarea rewrites
// line endings), and judged against the row those would read as edits the
// person never made and be written back over the stored value.
let profileFormOpened = null;
function readProfileForm(form) {
  const values = { name: form["pr-name"].value.trim(), member_id: form["pr-member"].value || null };
  for (const f of PROFILE_FIELDS) values[f.key] = form[`pr-${f.key}`].value.trim();
  return values;
}
async function submitProfile(form) {
  const name = form["pr-name"].value.trim(); if (!name) { form["pr-name"].focus(); return; }
  const id = form.dataset.profileId;
  const before = id ? profiles.find(x => x.id === id) : null;
  if (id && !before) { closeModal(); return; }
  const after = readProfileForm(form);
  const btn = modalEl.querySelector(".btn[type=submit]"); btn.disabled = true; btn.textContent = "Saving…";
  const now = nowIso();
  try {
    if (before) {
      // Only what this person changed, so a sibling's save from an older copy
      // of the profile cannot put back the fields someone else just edited.
      const changed = profileChanges(profileFormOpened ?? before, after);
      const cols = Object.keys(changed);
      // Readings a person logged for themselves are found through this link.
      // Changing it does not delete them, but it takes them off this profile,
      // so nobody should do that without being told.
      const wasMember = (profileFormOpened ?? before).member_id;
      if (DB && wasMember && "member_id" in changed) {
        const own = await db(`SELECT COUNT(*) AS n FROM app_elder_care__own_vitals WHERE member_id = ?`, [wasMember]);
        const n = Number(own.rows?.[0]?.n ?? 0);
        if (n > 0 && !(await hubConfirm({
          message: "Change who this profile is linked to?",
          description: `${memberName(wasMember)} logged ${n} ${n === 1 ? "reading" : "readings"} themselves. ${n === 1 ? "It" : "They"} will stop showing on this profile, and come back if you link ${memberName(wasMember)} again.`,
          confirmLabel: "Change the link",
        }))) { btn.disabled = false; btn.textContent = "Save"; return; }
      }
      if (cols.length) {
        if (DB) await db(`UPDATE app_elder_care__profiles SET ${cols.map(c => `${c} = ?`).join(", ")}, updated_at = ? WHERE id = ?`,
          [...cols.map(c => changed[c]), now, id]);
        Object.assign(before, changed, { updated_at: now });
        // Which self-logged readings are read depends on who is linked.
        if ("member_id" in changed) resetVitalsLoad();
      }
    } else {
      const row = { id: uid("p"), ...after, archived_at: "", created_by: me.id, created_at: now, updated_at: now };
      if (DB) await db(`INSERT INTO app_elder_care__profiles (id, name, member_id, ${PROFILE_FIELDS.map(f => f.key).join(", ")}, archived_at, created_by, created_at, updated_at) VALUES (?,?,?,${PROFILE_FIELDS.map(() => "?").join(",")},?,?,?,?)`,
        [row.id, row.name, row.member_id, ...PROFILE_FIELDS.map(f => row[f.key]), row.archived_at, row.created_by, row.created_at, row.updated_at]);
      profiles = [...profiles, row];
      selectedProfileId = row.id;
      if (row.member_id) resetVitalsLoad();
    }
    closeModal(); render();
  } catch (e) {
    btn.disabled = false; btn.textContent = "Save";
    // In the form, not on the page behind it: this form is taller than the
    // screen on a phone, and the page's own error line would sit out of sight.
    const box = modalEl.querySelector("#profile-error");
    box.textContent = /unique/i.test(e.message) ? "That member already has a profile here." : failText(e, "Couldn’t save the profile — try again.");
    box.hidden = false; box.scrollIntoView({ block: "nearest" });
  }
}
// Archived, never deleted: every record that names this person keeps a person
// to name, and the profile comes back with one tap.
async function setProfileArchived(id, archived) {
  const r = profiles.find(x => x.id === id); if (!r) return;
  if (archived && !(await hubConfirm({ message: `Archive ${r.name}'s profile?`, description: "Their visits, tasks, appointments and log entries are kept, and you can restore the profile at any time.", confirmLabel: "Archive" }))) return;
  const now = nowIso();
  const archived_at = archived ? now : "";
  try {
    if (DB) {
      const res = await db(`UPDATE app_elder_care__profiles SET archived_at = ?, updated_at = ? WHERE id = ?`, [archived_at, now, id]);
      if (res.changed === 0) {
        const row = await storedRow("profiles", id);
        profiles = withStoredRow(profiles, id, row);
        throw row === undefined ? new Error("the profile could not be read back after an update that changed nothing") : userError("That profile could not be changed. It may have been removed, or it is not yours to change.");
      }
    }
    // Looked up again, for the same reason as in toggleTask.
    const held = profiles.find(x => x.id === id);
    if (held) { held.archived_at = archived_at; held.updated_at = now; }
    if (archived && selectedProfileId === id) selectedProfileId = "";
    render();
  } catch (e) { showError(failText(e, "Couldn’t update the profile — try again.")); }
}
// Log entries and appointments written before anyone had a profile name
// nobody, and so show under everyone. This settles them in one step.
async function assignUntagged(id) {
  const r = profiles.find(x => x.id === id); if (!r) return;
  if (!(await hubConfirm({ message: `Are they all about ${r.name}?`, description: `Every log entry and appointment that names nobody will be marked as being about ${r.name}.`, confirmLabel: "Yes, mark them" }))) return;
  // A history load still in flight would replace both lists with rows read
  // before these updates, and bring the unnamed entries back on screen.
  if (historyPromise && !historyLoaded) await historyPromise.catch(() => {});
  try {
    // Each list is patched as soon as its own statement lands, so a failure on
    // the second leaves the screen showing exactly what was saved.
    // Zero rows while this screen holds entries that name nobody: the hub
    // changed none of them, so they are not shown as marked.
    const refused = (res, list) => res.changed === 0 && list.some(x => !x.profile_id);
    // Both statements are sent either way: one list being out of date here must
    // not keep the other from being marked.
    const obsRefused = DB && refused(await db(`UPDATE app_elder_care__observations SET profile_id = ? WHERE profile_id = ''`, [id]), observations);
    if (!obsRefused) for (const o of observations) if (!o.profile_id) o.profile_id = id;
    const apptRefused = DB && refused(await db(`UPDATE app_elder_care__appointments SET profile_id = ? WHERE profile_id = ''`, [id]), appointments);
    if (!apptRefused) for (const a of appointments) if (!a.profile_id) a.profile_id = id;
    if (obsRefused || apptRefused) throw userError("Some entries could not be marked. They may already have been changed, or they are not yours to change.");
    render();
  } catch (e) { showError(failText(e, "Couldn’t update the entries — try again.")); }
}

function profileCardHtml(r) {
  const entries = profileEntries(r, today());
  const linked = r.member_id ? memberMap.get(r.member_id) : null;
  return `
    <div class="card stack" data-testid="profile" data-profile-id="${esc(r.id)}">
      <div class="row-card">
        <div>
          <h2 style="margin-bottom:0" data-testid="profile-name">${esc(r.name)}</h2>
          ${linked ? `<div class="meta">A member here as ${esc(linked.name)}</div>` : ""}
        </div>
        ${canEdit() ? `<div class="actions">
          <button class="btn btn-ghost btn-sm" data-edit-profile="${esc(r.id)}">Edit</button>
          <button class="btn btn-ghost btn-sm" data-archive-profile="${esc(r.id)}">Archive</button>
        </div>` : ""}
      </div>
      ${entries.length
        ? `<dl class="profile">${entries.map(e => `<div><dt>${e.label}</dt><dd class="${e.long ? "long" : ""}" data-field="${e.key}">${esc(e.value)}</dd></div>`).join("")}</dl>`
        : `<p class="muted">Nothing recorded yet.${canEdit() ? " Use Edit to add what the care circle should know." : ""}</p>`}
      <div class="meta">Updated ${esc(fmtWhen(r.updated_at))}</div>
    </div>`;
}

function renderProfile() {
  const active = activeProfiles(profiles);
  const archived = archivedProfiles(profiles);
  const shown = inView();
  const addBtn = label => canEdit() ? `<button class="btn btn-sm" data-add="profile">${label}</button>` : "";
  let body;
  if (shown) {
    body = profileCardHtml(shown);
    // Only once there is someone else they could be about. With one profile
    // an unnamed record already reads as theirs, and there is nothing to settle.
    if (canEdit() && profiles.length > 1 && untaggedCount(observations, appointments) > 0) {
      body += `
        <div class="card stack" style="gap:8px" data-testid="untagged">
          <div>Some log entries and appointments name nobody, so they show under everyone.</div>
          <div class="actions"><button class="btn btn-ghost btn-sm" data-assign-untagged="${esc(shown.id)}">They are all about ${esc(shown.name)}</button></div>
        </div>`;
    }
  } else if (active.length) {
    body = active.map(r => `
      <div class="card row-card" data-testid="profile-summary" data-profile-id="${esc(r.id)}">
        <div>
          <strong>${esc(r.name)}</strong>
          ${profileEntries(r, today()).filter(e => !e.long).slice(0, 2).map(e => `<div class="meta">${esc(e.value)}</div>`).join("")}
        </div>
        <button class="btn btn-ghost btn-sm" data-profile="${esc(r.id)}">Open</button>
      </div>`).join("");
  } else {
    body = `<div class="card empty"><div>${chickadee("nest", { size: 72 })}</div>${archived.length
      ? "Every profile is archived."
      : canEdit()
        ? "Add the person you are caring for. Their profile keeps what everyone helping should know, and each visit, task, appointment and log entry can say who it is about."
        : "No profile has been added yet."}</div>`;
  }
  return `
    <div class="section-head"><h2>${active.length > 1 && !shown ? "Profiles" : "Profile"}</h2>${addBtn(profiles.length ? "Add another person" : "Add a person")}</div>
    <div class="stack">
      ${body}
      ${archived.length ? `<div class="section-head" style="margin-top:8px"><h3 class="muted">Archived</h3></div>${archived.map(r => `
        <div class="card row-card done" data-testid="archived-profile" data-profile-id="${esc(r.id)}">
          <strong>${esc(r.name)}</strong>
          ${canEdit() ? `<button class="btn btn-ghost btn-sm" data-restore-profile="${esc(r.id)}">Restore</button>` : ""}
        </div>`).join("")}` : ""}
    </div>
    ${recordCardHtml()}`;
}

// The switcher. Drawn only when there are two or more people to tell apart.
function profileChipsHtml() {
  const active = activeProfiles(profiles);
  if (active.length < 2) return "";
  const view = viewId();
  const chip = (id, label) => `<button class="chip ${view === id ? "active" : ""}" data-testid="profile-chip" data-profile="${esc(id)}" aria-pressed="${view === id}">${esc(label)}</button>`;
  return `<div class="chips" role="group" aria-label="Whose care to show">${chip("", "Everyone")}${active.map(r => chip(r.id, r.name)).join("")}</div>`;
}

const TABS = [
  { id: "schedule", label: "Schedule" },
  { id: "shifts", label: "Shifts" },
  { id: "tasks", label: "Tasks" },
  { id: "appointments", label: "Appointments" },
  { id: "log", label: "Log" },
  { id: "vitals", label: "Vitals" },
  { id: "profile", label: "Profile" },
];

function render() {
  const root = document.getElementById("root");
  root.className = "app-root";
  if (loadFailed) {
    root.innerHTML = `
      <div class="topbar">
        <div><h1>${glyph("hand-heart")} Elder Care</h1><p class="muted tiny">Coordinate care for someone you love.</p></div>
      </div>
      <div class="load-error" data-testid="load-error" role="alert"><span>Couldn’t load the care record.</span> <button type="button" class="load-error-retry" data-testid="load-retry">Try again</button></div>`;
    return;
  }
  const focused = document.activeElement;
  const typing = focused && (focused.id === "sh-summary" || focused.id === "sh-handoff")
    ? { id: focused.id, start: focused.selectionStart, end: focused.selectionEnd } : null;
  const body = tab === "schedule" ? renderSchedule() : tab === "shifts" ? renderShifts() : tab === "tasks" ? renderTasks() : tab === "appointments" ? renderAppointments() : tab === "profile" ? renderProfile() : tab === "vitals" ? renderVitals() : renderLog();
  const active = activeProfiles(profiles);
  root.innerHTML = `
    <div class="topbar">
      <div><h1>${glyph("hand-heart")} Elder Care</h1><p class="muted tiny">${active.length === 1 ? `Caring for ${esc(active[0].name)}.` : "Coordinate care for someone you love."}</p></div>
    </div>
    ${error ? `<div class="error">${esc(error)}</div>` : ""}
    ${profileChipsHtml()}
    <div class="tabs">${TABS.map(t => `<button class="tab ${tab === t.id ? "active" : ""}" data-tab="${t.id}">${t.label}</button>`).join("")}</div>
    ${body}
    ${tab === "log" || tab === "profile" || tab === "vitals" ? "" : earlierHistoryHtml()}`;
  // The running shift's boxes are part of the page, not a modal, so a redraw
  // replaces the one being typed in. Its text is kept in shiftDraft; this puts
  // the caret back.
  if (typing) {
    const box = document.getElementById(typing.id);
    if (box) { box.focus(); box.setSelectionRange(typing.start, typing.end); }
  }
}

// Re-render only the list on each keystroke so the search box keeps focus.
document.addEventListener("input", (e) => {
  if (e.target.id === "sh-summary" || e.target.id === "sh-handoff") {
    const id = e.target.form?.dataset.shiftId ?? "";
    if (shiftDraft.id !== id) shiftDraft = { ...noDraft(), id };
    shiftDraft[e.target.id === "sh-summary" ? "summary" : "handoff"] = e.target.value;
    // "Saved." stops being true at the next keystroke. Taken off in place: a
    // redraw here would move the caret.
    if (shiftSaved) { shiftSaved = ""; document.querySelector('[data-testid="shift-saved"]')?.remove(); }
    return;
  }
  if (e.target.id !== "search") return;
  searchQ = e.target.value;
  // Notes are encrypted at rest, so this match runs client-side over loaded
  // rows. Searching a windowed set would report "no observations match" about
  // records that exist, which is a false negative on someone's care record.
  if (searchQ && !historyLoaded) loadFullHistory().then(render).catch(() => render());
  const el = document.getElementById("observation-list");
  if (el) el.innerHTML = renderObservationList();
});

document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-tab]");
  if (!t) return;
  if (t.dataset.testid === "load-retry") { init(); return; }
  if (t.dataset.tab) {
    tab = t.dataset.tab; error = "";
    // Started before the draw, so a tab reopened after a failed read shows
    // the retry in progress and not the old failure.
    if (tab === "vitals") loadVitals(false).then(renderIfOnVitals);
    render();
    return;
  }
  if (t.dataset.loadVitals) { loadVitals(t.dataset.loadVitals === "older").then(renderIfOnVitals); render(); return; }
  if (t.dataset.vitalKind) { openVitalKind = openVitalKind === t.dataset.vitalKind ? "" : t.dataset.vitalKind; render(); return; }
  if (t.dataset.report) return openRecord(t.dataset.report, t.dataset.format);
  if (t.dataset.recordsRetry !== undefined) { records.failed = false; render(); return; }
  if (t.dataset.delVital) return deleteVital(t.dataset.delVital, t.dataset.own === "1");
  if (t.dataset.profile !== undefined) { selectedProfileId = t.dataset.profile; error = ""; render(); return; }
  if (t.dataset.loadHistory !== undefined) {
    t.disabled = true; t.textContent = "Loading…";
    loadFullHistory().then(render).catch(() => render());
    return;
  }
  if (t.dataset.close !== undefined) { closeModal(); return; }
  const add = t.dataset.add;
  if (add === "visit") return visitModal();
  if (add === "task") return taskModal();
  if (add === "appt") return apptModal();
  if (add === "obs") return obsModal();
  if (add === "profile") return profileModal("");
  if (add === "vital") return vitalModal();
  if (add === "shift") return shiftModal("");
  if (t.dataset.startShift !== undefined) return startShift();
  if (t.dataset.saveShift !== undefined) return saveRunningShift(t.form, false);
  if (t.dataset.editShift) return shiftModal(t.dataset.editShift);
  if (t.dataset.editVital) return vitalModal(t.dataset.editVital);
  if (t.dataset.delShift) return deleteShift(t.dataset.delShift);
  if (t.dataset.obsAudience) return setObsAudience(t.dataset.obsAudience, t.dataset.audience === "family" ? "family" : "everyone");
  if (t.dataset.editProfile) return profileModal(t.dataset.editProfile);
  if (t.dataset.archiveProfile) return setProfileArchived(t.dataset.archiveProfile, true);
  if (t.dataset.restoreProfile) return setProfileArchived(t.dataset.restoreProfile, false);
  if (t.dataset.assignUntagged) return assignUntagged(t.dataset.assignUntagged);
  if (t.dataset.toggle) return toggleTask(t.dataset.toggle);
  if (t.dataset.delTask) return deleteTask(t.dataset.delTask);
  if (t.dataset.delVisit) return deleteVisit(t.dataset.delVisit);
  if (t.dataset.delAppt) return deleteAppt(t.dataset.delAppt);
  if (t.dataset.delObs) return deleteObs(t.dataset.delObs);
  if (t.dataset.claim) return claimAppt(t.dataset.claim);
});

document.addEventListener("change", e => {
  if (e.target.id === "rec-from" || e.target.id === "rec-to") {
    if (e.target.id === "rec-from") recordFrom = e.target.value; else recordTo = e.target.value;
    recordRangeEdited = true;
    return;
  }
  // Each kind of reading has its own fields: one number or two, one unit or a choice.
  if (e.target.id === "vt-kind") {
    const form = e.target.form;
    const profile = profiles.find(x => x.id === form.dataset.profileId);
    if (!profile) { closeModal(); return; }
    form.querySelector("#vt-fields").innerHTML = vitalFieldsHtml(vitalKind(e.target.value) ?? VITAL_KINDS[0], profile);
    form.querySelector("#vital-error").hidden = true;
    form.querySelector("#vt-value").focus();
    return;
  }
  const cb = e.target.closest("[data-toggle]");
  if (cb) toggleTask(cb.dataset.toggle);
});

document.addEventListener("submit", e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === "visit-form") submitVisit(e.target);
  else if (id === "task-form") submitTask(e.target);
  else if (id === "appt-form") submitAppt(e.target);
  else if (id === "obs-form") submitObs(e.target);
  else if (id === "profile-form") submitProfile(e.target);
  else if (id === "vital-form") submitVital(e.target);
  else if (id === "shift-form") submitShift(e.target);
  else if (id === "running-shift-form") saveRunningShift(e.target, true);
});

async function deleteVisit(id) {
  if (!(await hubConfirm({ message: "Remove this visit?", destructive: true, confirmLabel: "Remove" }))) return;
  try {
    if (DB) {
      const res = await db(`DELETE FROM app_elder_care__visits WHERE id = ?`, [id]);
      // As on the appointment path: gone is removed and still retracted, still
      // there is refused and nothing is retracted.
      if (res.changed === 0) {
        const row = await storedRow("visits", id);
        if (row !== null) {
          visits = sortByDateTime(withStoredRow(visits, id, row));
          throw row ? userError("That visit could not be removed. It may not be yours to remove.") : new Error("the visit could not be read back after a delete that removed nothing");
        }
      }
    }
    visits = visits.filter(x => x.id !== id); render();
  } catch (e) { showError(failText(e, "Couldn’t remove the visit — try again.")); return; }
  // Same ordering and the same unconditional publish as the appointment
  // path above, for the same reasons.
  await publishRetraction("elder_care.visit_cancelled", { source_ref_id: calendarRef("visit", id) });
}

init();
</script>
